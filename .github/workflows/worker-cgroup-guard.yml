name: Proof worker cgroup preflight
on:
  push:
    paths:
      - 'integrations/worker-cgroup-guard/**'
      - '.github/workflows/worker-cgroup-guard.yml'
  pull_request:
    paths:
      - 'integrations/worker-cgroup-guard/**'
      - '.github/workflows/worker-cgroup-guard.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path integrations/worker-cgroup-guard/Cargo.toml -- --check
      - run: cargo test --manifest-path integrations/worker-cgroup-guard/Cargo.toml
      - run: cargo clippy --manifest-path integrations/worker-cgroup-guard/Cargo.toml --all-targets -- -D warnings
