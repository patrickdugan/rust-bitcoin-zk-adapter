name: Supernode systemd isolation templates
on:
  push:
    paths:
      - 'deploy/systemd/**'
      - 'tools/test_systemd_units.py'
      - '.github/workflows/systemd-units.yml'
  pull_request:
    paths:
      - 'deploy/systemd/**'
      - 'tools/test_systemd_units.py'
      - '.github/workflows/systemd-units.yml'
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools.test_systemd_units -v
