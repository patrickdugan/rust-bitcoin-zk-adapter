name: Three-UID isolation acceptance (synthetic proofs)
# Installs the deploy/systemd units unchanged on a disposable runner, with
# synthetic Core/fetch/verify stand-ins, and records kernel enforcement,
# crash recovery and pinned-verifier rejection. It cannot show acceptance of
# a genuine Raito proof; see docs/evidence/raito-live-acceptance/.
on:
  push:
    branches: ['evidence/raito-live-acceptance']
    paths:
      - 'tools/isolation-acceptance/**'
      - '.github/workflows/isolation-acceptance.yml'
  pull_request:
    paths:
      - 'tools/isolation-acceptance/**'
      - '.github/workflows/isolation-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The runner context is unavailable in job-level env.
      - run: echo "EV=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Offline lifecycle evidence fixtures
        run: python3 -m unittest discover -s tools/isolation-acceptance -p test_lifecycle.py -v
      - name: Build gateway and brokers
        run: |
          for m in services/supernode-rpc services/proof-worker-broker services/raito-verifier-broker; do
            cargo build --manifest-path $m/Cargo.toml
          done
      - name: Host facts
        run: |
          uname -a; systemd --version | head -1; stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers; nproc; free -m; swapon --show
      - name: Stage 2 - three-UID systemd deployment, probes, crash recovery
        id: stage2
        shell: bash
        continue-on-error: true
        run: sudo env T="$GITHUB_WORKSPACE" EV="$EV" bash tools/isolation-acceptance/run_stage2.sh 2>&1 | tee stage2.log
      - name: Build pinned Raito verifier (48c237a, nightly-2025-07-14)
        id: build_verifier
        shell: bash
        continue-on-error: true
        run: |
          rustup toolchain install nightly-2025-07-14 --profile minimal
          /usr/bin/time -v cargo +nightly-2025-07-14 build --release \
            --manifest-path integrations/raito/Cargo.toml 2>&1 | tail -25 | tee raito-build.log
      - name: Stage 3 - pinned verifier rejects non-proofs, directly and behind its broker
        id: stage3
        shell: bash
        continue-on-error: true
        run: |
          sudo env T="$GITHUB_WORKSPACE" EV="$EV" \
            V="$GITHUB_WORKSPACE/integrations/raito/target/release/rust-bitcoin-raito-sidecar" \
            bash tools/isolation-acceptance/stage3.sh 2>&1 | tee stage3.log
      - name: Outcome annotations
        if: always()
        shell: bash
        env:
          STAGE2_OUTCOME: ${{ steps.stage2.outcome }}
          BUILD_OUTCOME: ${{ steps.build_verifier.outcome }}
          STAGE3_OUTCOME: ${{ steps.stage3.outcome }}
        run: |
          rc=0
          python3 tools/isolation-acceptance/annotate.py stage2.log raito-build.log stage3.log || rc=1
          # Earlier steps deliberately continue to preserve all artifacts.
          # Their real outcomes MUST be checked here, not just log keywords.
          for name in STAGE2_OUTCOME BUILD_OUTCOME STAGE3_OUTCOME; do
            if [[ "${!name}" != success ]]; then
              echo "::error title=Acceptance stage failed::${name}=${!name}"
              rc=1
            fi
          done
          if ! grep -Fq '17/17 passed' stage2.log; then
            echo "::error title=Incomplete synthetic matrix::17/17 expected cases were not observed"
            rc=1
          fi
          if ! grep -Fq 'PASS real pinned verifier (dev=false) behind third-UID broker leaves synthetic bytes unverified' stage3.log; then
            echo "::error title=Missing verifier negative result::real pinned verifier rejection was not observed"
            rc=1
          fi
          exit "$rc"
      - name: Keep sanitized evidence
        if: always()
        run: sudo chown -R "$(id -u)" "$EV" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-acceptance-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
