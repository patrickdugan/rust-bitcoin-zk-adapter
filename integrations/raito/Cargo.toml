[package]
name = "rust-bitcoin-raito-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bitcoin = "=0.32.102"
bincode = "1.3"
bzip2 = "0.4"
raito-spv-verify = { git = "https://github.com/starkware-bitcoin/raito", rev = "48c237ac941d8061a857ecd111d7e81107912556" }
rust-bitcoin-zk-adapter = { path = "../.." }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
