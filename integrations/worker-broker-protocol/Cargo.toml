[package]
name = "supernode-worker-broker-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Bounded Unix IPC protocol between the Supernode gateway and isolated proof workers"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
