[package]
name = "rust-bitcoin-raito-fetcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Isolated, policy-pinned upstream Raito compressed SPV proof fetching worker"

[workspace]

[dependencies]
bitcoin = "=0.32.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
url = "2.5"
supernode-cgroup-guard = { path = "../worker-cgroup-guard" }
