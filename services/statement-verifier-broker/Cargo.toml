[package]
name = "supernode-statement-verifier-broker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Separate-UID runner for the pinned Bitcoin statement verifiers (Nova header chain, SP1 payment)"

[workspace]
[dependencies]
supernode-worker-broker-protocol = { path = "../../integrations/worker-broker-protocol" }
bitcoin = "=0.32.102"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "time", "sync"] }
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
