[package]
name = "rust-bitcoin-supernode-rpc"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Bounded read-only Bitcoin Core RPC gateway with proof-aware Bitcoin transaction bundles"

# A separately compiled service. Cairo/STWO proving is delegated to workers.
[workspace]

[dependencies]
axum = "0.8"
bitcoin = "=0.32.102"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
zeromq = "0.6"
serde = { version = "1", features = ["derive"] }
