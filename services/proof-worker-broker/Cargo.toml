[package]
name = "supernode-proof-worker-broker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Unprivileged Unix broker for proof workers under a distinct service UID"

[workspace]

[dependencies]
supernode-worker-broker-protocol = { path = "../../integrations/worker-broker-protocol" }
bitcoin = "=0.32.102"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "time", "sync"] }
nix = { version = "0.29", default-features = false, features = ["signal", "process", "user"] }
